
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Portefolio</title>

    <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>

    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>

        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>

        <div id="unity-warning"></div>
    </div>

    <script>
        const canvas = document.querySelector("#unity-canvas");

        function unityShowBanner(msg, type) {
            const warningBanner = document.querySelector("#unity-warning");

            function updateBannerVisibility() {
                warningBanner.style.display =
                    warningBanner.children.length ? "block" : "none";
            }

            const div = document.createElement("div");
            div.innerHTML = msg;
            warningBanner.appendChild(div);

            if (type === "error") {
                div.style = "background: red; padding: 10px;";
            } else {
                if (type === "warning") {
                    div.style = "background: yellow; padding: 10px;";
                }

                setTimeout(() => {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }

            updateBannerVisibility();
        }

        const buildUrl = "Build";

        const loaderUrl = buildUrl + "/PortefolioMaximeWeb.loader.js";

        const config = {
            arguments: [],
            dataUrl: buildUrl + "/PortefolioMaximeWeb.data.unityweb",
            frameworkUrl: buildUrl + "/PortefolioMaximeWeb.framework.js.unityweb",
            codeUrl: buildUrl + "/PortefolioMaximeWeb.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Portefolio",
            productVersion: "0.1.0",
            showBanner: unityShowBanner,
            matchWebGLToCanvasSize: true
        };

        function resizeCanvas() {
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        document.querySelector("#unity-loading-bar").style.display = "block";

        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width =
                    (100 * progress) + "%";

            }).then(() => {
                document.querySelector("#unity-loading-bar").style.display = "none";

            }).catch((message) => {
                console.error("Erreur Unity WebGL :", message);
                alert(message);
            });
        };

        script.onerror = () => {
            console.error("Impossible de charger le fichier Unity Loader :", loaderUrl);
            alert("Impossible de charger le jeu. Vérifie les fichiers du dossier Build.");
        };

        document.body.appendChild(script);
    </script>

</body>
</html>
